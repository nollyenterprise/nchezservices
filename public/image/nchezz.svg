<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="440" height="100" fill="none">
  <!-- Red "N" Engineered Icon -->
  <g transform="translate(10, 10)">
    <!-- Container background glow/plate -->
    <rect width="80" height="80" rx="16" fill="#F90909" fill-opacity="0.08" />
    <rect x="0.5" y="0.5" width="79" height="79" rx="15.5" stroke="#F90909" stroke-opacity="0.25" />
    
    <!-- Left vertical bar of N -->
    <path d="M22 20H32V60H22V20Z" fill="#F90909" />
    <!-- Diagonal crossbar of N with faceted bevel -->
    <path d="M28 20L56 56V60H46L22 28V20H28Z" fill="#D40606" />
    <path d="M30 20L58 56V60H52L24 24V20H30Z" fill="#F90909" />
    <!-- Right vertical bar of N -->
    <path d="M48 20H58V60H48V20Z" fill="#F90909" />
    
    <!-- Accent energy pip -->
    <circle cx="53" cy="23" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark -->
  <g transform="translate(105, 20)">
    <!-- Main NCHEZ title -->
    <text x="0" y="38" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.02em" fill="#32135C">NCHEZ</text>
    <rect x="146" y="16" width="6" height="24" rx="2" fill="#F90909" />
    <!-- Subtitle -->
    <text x="1" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="0.22em" fill="#796094">SERVICES LIMITED</text>
  </g>
</svg>
