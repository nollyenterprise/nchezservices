<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .nchez-heading {
        font-family: 'Space Grotesk', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        fill: #32135C;
        letter-spacing: -0.01em;
      }
      .nchez-sub {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        fill: #796094;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <!-- Left Emblem (Height: 68px, Width: ~50px) -->
  <g transform="translate(42, 45) scale(0.28)">
    <!-- Left Pillar Shape -->
    <path 
      d="M -75 115 
         L -75 -95 
         L -22 -128 
         L -22 -98 
         L 16 -74 
         L -18 85 
         Z" 
      fill="#F90909"
    />

    <!-- Right Arch & Leg Shape -->
    <path 
      d="M -9 -56 
         L 52 -18 
         L 75 -4 
         L 75 98 
         L 28 98 
         L 28 32 
         L -9 9 
         Z" 
      fill="#F90909"
    />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(85, 38)">
    <text x="0" y="0" class="nchez-heading" font-size="27">Nchez</text>
    <text x="0" y="24" class="nchez-sub" font-size="13">services limited</text>
  </g>
</svg>
